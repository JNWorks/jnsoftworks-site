<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Gerador de chaves e controle de pontuacao para torneios Super N de beach tennis, de 4 a 16 participantes.">
<meta name="theme-color" content="#12A5DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Super N">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.1mbtxnc.png">
<link rel="icon" href="icone-192.1mbtxnc.png">
</head>
<body>
<title>Super N Beach Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --areia:#F7E8C7; --areia-2:#FFF6E4; --areia-3:#EFDCB4; --areia-linha:#D8BC85;
  --mar:#0B3A5B; --mar-2:#2A6285;
  --ceu:#12A5DF; --ceu-claro:#CFEDFB; --ceu-escuro:#0B7FAE;
  --bola:#FFC800; --laranja:#FF6A2C; --laranja-escuro:#E2500F;
  --verde:#12A05C; --vermelho:#D93A2B;
  --fundo:var(--areia); --superf:#FFFFFF; --superf-2:var(--areia-2);
  --texto:var(--mar); --texto-2:#4E7590; --borda:var(--areia-linha);
  --sombra:0 2px 0 rgba(11,58,91,.10), 0 8px 22px -12px rgba(11,58,91,.35);
  --destaque-1:#FFF3C4; --destaque-2:#FFF9E4;
  --pill-on-bg:var(--mar); --pill-on-fg:#fff;
  --tag-bola-bg:#FFF0BF; --tag-bola-fg:#8A6100;
  --tag-ok-bg:#D7F3E4; --tag-ok-fg:#0A7042;
  --pt-cor:var(--ceu-escuro);

  --r:16px; --r-s:11px;
  --f-disp:'Archivo Black','Arial Black',system-ui,sans-serif;
  --f-body:'Outfit','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --fundo:#07202F; --superf:#0E3247; --superf-2:#123A52;
  --texto:#EAF6FF; --texto-2:#93B8CE; --borda:#1E4E69;
  --areia-2:#123A52; --areia-3:#1A4460; --ceu-claro:#0F3E56;
  --ceu:#3CC0F0; --bola:#FFD227; --laranja:#FF8348; --laranja-escuro:#C9531F;
  --destaque-1:#3B3000; --destaque-2:#27210A;
  --pill-on-bg:#3CC0F0; --pill-on-fg:#04222F;
  --tag-bola-bg:#4A3A00; --tag-bola-fg:#FFD227;
  --tag-ok-bg:#0C3D28; --tag-ok-fg:#5BD69B;
  --pt-cor:#3CC0F0;
  --sombra:0 2px 0 rgba(0,0,0,.25), 0 10px 24px -14px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --fundo:#07202F; --superf:#0E3247; --superf-2:#123A52;
  --texto:#EAF6FF; --texto-2:#93B8CE; --borda:#1E4E69;
  --areia-2:#123A52; --areia-3:#1A4460; --ceu-claro:#0F3E56;
  --ceu:#3CC0F0; --bola:#FFD227; --laranja:#FF8348; --laranja-escuro:#C9531F;
  --destaque-1:#3B3000; --destaque-2:#27210A;
  --pill-on-bg:#3CC0F0; --pill-on-fg:#04222F;
  --tag-bola-bg:#4A3A00; --tag-bola-fg:#FFD227;
  --tag-ok-bg:#0C3D28; --tag-ok-fg:#5BD69B;
  --pt-cor:#3CC0F0;
  --sombra:0 2px 0 rgba(0,0,0,.25), 0 10px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--texto);
  font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
/* no mouse, tudo que responde ao clique mostra a mãozinha */
[role="button"],select,summary,label.fld>select{cursor:pointer}
button:disabled,[disabled],[aria-disabled="true"]{cursor:default}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.tnum{font-variant-numeric:tabular-nums}
.hide{display:none!important}

.top{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,var(--ceu) 0%,var(--ceu-escuro) 100%);
  color:#fff;padding:calc(10px + env(safe-area-inset-top)) 0 12px;
  box-shadow:0 6px 18px -10px rgba(11,58,91,.7)
}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:42px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:19px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:11px;font-weight:700;opacity:.92;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-body)}
.icobtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;font-size:18px;font-weight:800;flex:none}
.icobtn:active{transform:scale(.94)}
.ball{width:28px;height:28px;flex:none;background:var(--bola-img);filter:drop-shadow(0 1px 2px rgba(7,32,47,.35))}

.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:var(--superf);border-top:1px solid var(--borda);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -8px 20px -14px rgba(11,58,91,.6)
}
.tabs button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--texto-2);font-size:11px;font-weight:700}
.tabs button .ic{font-size:19px;line-height:1}
.tabs button.on{color:var(--laranja)}

.card{background:var(--superf);border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sombra);padding:14px}
.sec{margin:18px 0}
.sec>h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-2);font-family:var(--f-body);font-weight:800;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--texto-2)}
.small{font-size:13px}
.center{text-align:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 18px;border-radius:13px;font-weight:700;font-size:15px;
  background:var(--superf-2);color:var(--texto);border:1px solid var(--borda);
  box-shadow:0 2px 0 var(--borda);transition:transform .06s,box-shadow .06s
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.pri{background:var(--laranja);color:#fff;border-color:var(--laranja-escuro);box-shadow:0 3px 0 var(--laranja-escuro)}
.btn.azul{background:var(--ceu);color:#fff;border-color:var(--ceu-escuro);box-shadow:0 3px 0 var(--ceu-escuro)}
.btn.blk{display:flex;width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--vermelho)}
.btn[disabled]{opacity:.45;pointer-events:none}

input[type=text],input[type=number],select,textarea{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--borda);
  background:var(--superf-2);font-weight:500
}
textarea{min-height:240px;line-height:1.6;resize:vertical;font-size:15px}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);margin-bottom:5px}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:9px 14px;border-radius:999px;border:1px solid var(--borda);background:var(--superf-2);font-weight:600;font-size:14px}
.pill.on{background:var(--pill-on-bg);color:var(--pill-on-fg);border-color:var(--pill-on-bg)}

.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.tag.ceu{background:var(--ceu-claro);color:var(--ceu-escuro)}
.tag.bola{background:var(--tag-bola-bg);color:var(--tag-bola-fg)}
.tag.ok{background:var(--tag-ok-bg);color:var(--tag-ok-fg)}

.jogo{background:var(--superf);border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;margin-bottom:11px}
.jogo .cab{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--superf-2);border-bottom:1px solid var(--borda);font-size:11px;font-weight:800;color:var(--texto-2);letter-spacing:.08em;text-transform:uppercase}
.quadra{position:relative;display:grid;grid-template-columns:1fr 10px 1fr;align-items:stretch;background:linear-gradient(180deg,var(--ceu-claro),var(--superf))}
.lado{padding:13px 12px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.lado.dir{text-align:right;align-items:flex-end}
.nome{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.rede{justify-self:center;width:2px;background:repeating-linear-gradient(180deg,var(--texto) 0 5px,transparent 5px 9px);opacity:.4}
.placar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px dashed var(--borda);background:var(--superf)}
.gm{font-family:var(--f-disp);font-size:34px;text-align:center;padding:5px 0;line-height:1;font-variant-numeric:tabular-nums}
.gm.win{color:var(--laranja)}
.x{color:var(--texto-2);font-weight:800;font-size:15px}
.acoes{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--borda);background:var(--superf-2)}
.acoes .btn{flex:1}
.bye{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:12px;background:var(--areia-3);border:1px dashed var(--borda);font-size:13px;font-weight:600;margin-bottom:11px}

.tblwrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--borda);box-shadow:var(--sombra);background:var(--superf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 7px;text-align:center;white-space:nowrap}
th{background:var(--mar);color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
td.nm{text-align:left;font-weight:700;white-space:normal;min-width:118px}
tbody tr:nth-child(even){background:var(--superf-2)}
tbody tr.top1 td{background:var(--destaque-1)}
tbody tr.top2 td{background:var(--destaque-2)}
.pos{font-family:var(--f-disp);font-size:15px}

.modal{position:fixed;inset:0;z-index:60;background:rgba(7,32,47,.62);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--fundo);width:100%;max-width:720px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.modal h2{font-size:20px;margin-bottom:4px}
.puxador{width:44px;height:5px;border-radius:3px;background:var(--borda);margin:0 auto 12px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px;max-height:88vh}}
/* diálogos curtos abrem centralizados na tela, em qualquer largura */
.modal.centro{align-items:center;padding:14px}
.modal.centro .box{border-radius:22px;max-height:92vh;padding-bottom:18px}
.modal.centro .puxador{display:none}
/* espaço reservado para o aviso: aparece e some sem empurrar os botões */
.slot{min-height:82px;display:flex;align-items:center;margin:10px 0 2px}
.slot .aviso{width:100%;margin:0}
@media (min-width:560px){.slot{min-height:58px}}

.live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.livecard{border-radius:var(--r);border:1px solid var(--borda);background:var(--superf);padding:12px;text-align:center;box-shadow:var(--sombra)}
.livecard.saque{border-color:var(--bola);box-shadow:0 0 0 3px rgba(255,200,0,.4)}
.livecard .who{font-weight:700;font-size:14px;min-height:40px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.pt{font-family:var(--f-disp);font-size:50px;line-height:1;margin:6px 0;color:var(--pt-cor);font-variant-numeric:tabular-nums}
.gmlive{font-weight:800;font-size:13px;color:var(--texto-2)}
.addpt{margin-top:9px;width:100%;padding:16px;border-radius:13px;background:var(--ceu);color:#fff;font-family:var(--f-disp);font-size:18px;box-shadow:0 3px 0 var(--ceu-escuro)}
.addpt:active{transform:translateY(3px);box-shadow:none}
.addpt[disabled]{opacity:.4;pointer-events:none;box-shadow:none}

.bracket{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px}
.bcol{min-width:186px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.bcol h3{font-size:11px;font-family:var(--f-body);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-2);text-align:center}
.bmatch{border:1px solid var(--borda);border-radius:var(--r-s);overflow:hidden;background:var(--superf);box-shadow:var(--sombra)}
.bteam{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;font-size:13px;font-weight:600;align-items:center;text-align:left;width:100%}
.bteam+.bteam{border-top:1px solid var(--borda)}
.bteam.w{background:var(--ceu-claro);font-weight:800}
.bteam .sc{font-family:var(--f-disp);font-size:15px}
.bteam.vazio{color:var(--texto-2);font-style:italic;font-weight:500}

.lista{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--superf);border:1px solid var(--borda);border-radius:var(--r-s);box-shadow:var(--sombra)}
.item .num{width:26px;height:26px;border-radius:50%;background:var(--ceu-claro);color:var(--ceu-escuro);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.vazio{text-align:center;padding:34px 18px;color:var(--texto-2)}
.vazio .big{font-size:42px;margin-bottom:8px}
hr{border:none;border-top:1px solid var(--borda);margin:16px 0}
.aviso{background:var(--ceu-claro);border:1px solid var(--ceu);border-radius:var(--r-s);padding:11px 13px;font-size:13.5px;line-height:1.5}
.regras h3{font-family:var(--f-disp);font-size:17px;margin:18px 0 6px}
.regras h3:first-child{margin-top:4px}
.regras p{margin:0 0 10px}
.regras ul,.regras ol{margin:0 0 12px;padding-left:20px}
.regras li{margin-bottom:5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:80;background:var(--mar);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
/* ---------- cadeia de critérios ---------- */
.cadeia{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:c}
.cadeia li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;line-height:1.35;color:var(--texto-2)}
.cadeia li .cn{flex:none;width:21px;height:21px;border-radius:6px;background:var(--superf-2);border:1px solid var(--borda);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--texto-2);font-variant-numeric:tabular-nums}
.cadeia li.pri{color:var(--texto);font-weight:700}
.cadeia li.pri .cn{background:var(--laranja);border-color:var(--laranja-escuro);color:#fff}
.cadeia li.some{opacity:.55}
.cadeia li.some .rot{text-decoration:line-through}
.cadeia li.mov{align-items:center;background:var(--superf-2);border:1px solid var(--borda);border-radius:var(--r-s);padding:6px 8px}
.cadeia li.mov.pri,.cadeia li.mov.fix{background:transparent;border-color:transparent}
.cadeia li .porque{display:block;font-size:11.5px;font-weight:600;opacity:.8;margin-top:1px}
.mv{display:flex;gap:4px;flex:none}
.mv button{width:32px;height:32px;border-radius:9px;background:var(--superf);border:1px solid var(--borda);
  font-size:12px;font-weight:800;color:var(--texto-2);display:grid;place-items:center}
.mv button:active{transform:translateY(1px)}
.mv button[disabled]{opacity:.3}

/* ---------- alternador de visão ---------- */
.seg{display:flex;gap:4px;padding:4px;background:var(--superf-2);border:1px solid var(--borda);border-radius:13px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--texto-2)}
.seg button.on{background:var(--superf);color:var(--texto);box-shadow:var(--sombra)}

/* ---------- planilha por rodada ---------- */
.planilha th:first-child,.planilha td:first-child{position:sticky;left:0;z-index:2}
.planilha td:first-child{background:var(--superf);text-align:left;font-weight:700;min-width:126px;
  box-shadow:1px 0 0 var(--borda)}
.planilha tbody tr:nth-child(even) td:first-child{background:var(--superf-2)}
.planilha td.cel{min-width:38px;font-variant-numeric:tabular-nums;font-weight:700;cursor:pointer;padding:0}
.planilha td.cel button{width:100%;padding:9px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.planilha td.cel.venc button{color:var(--laranja);font-weight:800}
.planilha td.cel.folga{color:var(--texto-2);font-weight:400}
.planilha td.tot{font-family:var(--f-disp);font-size:15px;background:var(--destaque-2)}
.planilha .np{color:var(--texto-2);font-weight:400}

<script>
/* ============================================================
   SUPER 8 BEACH TENNIS — gerador de chaves e controle de pontos
   ============================================================ */
"use strict";

/* ---------- armazenamento (tolerante a sandbox sem localStorage) ---------- */
const CHAVE_LS = "super8bt.v1";
let memoria = null;
function lerBruto(){ try{ return localStorage.getItem(CHAVE_LS); }catch(e){ return memoria; } }
function gravarBruto(v){ try{ localStorage.setItem(CHAVE_LS, v); }catch(e){ memoria = v; } }

let DB = { torneios: [], ativo: null, tema: null };
function salvar(){ gravarBruto(JSON.stringify(DB)); }
function carregar(){
  const b = lerBruto();
  if(b){ try{ DB = Object.assign(DB, JSON.parse(b)); }catch(e){} }
  if(!Array.isArray(DB.torneios)) DB.torneios = [];
  DB.torneios = DB.torneios.map(sanearTorneio).filter(Boolean);
  if(!DB.torneios.some(t => t.id === DB.ativo)) DB.ativo = null;
  /* torneios criados antes do revezamento de quadras ganham a distribuição
     equilibrada uma vez só — e só se ainda não tiverem nenhum jogo em andamento,
     senão as quadras mudariam no meio do torneio */
  let mudou = false;
  DB.torneios.forEach(t => {
    if(t.modo === "mata" || t.cfg.qeq) return;
    if(!todosJogos(t).some(j => j.done || j.live)) equilibrarQuadras(t);
    t.cfg.qeq = 1; mudou = true;
  });
  /* rodízios montados antes da correção têm jogo de menos: o número de quadras
     cortava jogos da rodada em vez de só espalhá-los em levas. Refaz a chave,
     mas só a de quem ainda não jogou nada — quem já começou fica como está. */
  DB.torneios.forEach(t => {
    if(t.cfg.gfix) return;
    t.cfg.gfix = 1; mudou = true;
    if(t.modo !== "rodizio" || !t.rodadas.length) return;
    if(todosJogos(t).some(j => j.done || j.live)) return;
    if(Math.max.apply(null, t.rodadas.map(r => r.jogos.length)) >= jogosPorRodada(t.parts.length)) return;
    gerarChave(t); t.rodadaAtual = 1;
  });
  if(mudou) salvar();
}
/* Descarta/normaliza torneios corrompidos ou vindos de versões antigas,
   para um dado ruim não derrubar o app inteiro. */
function sanearTorneio(t){
  if(!t || typeof t !== "object") return null;
  if(typeof t.id !== "string" || !t.id) return null;
  if(!MODOS[t.modo]) return null;
  if(!Array.isArray(t.parts) || t.parts.length < 2) return null;
  if(t.parts.some(p => !p || typeof p.id !== "string")) return null;
  if(!t.cfg || typeof t.cfg !== "object") return null;
  if(t.modo === "mata"){
    if(!t.chave || !Array.isArray(t.chave.rodadas) || !t.chave.rodadas.length) return null;
    t.rodadas = [];
  } else {
    if(!Array.isArray(t.rodadas)) return null;
    t.chave = null;
  }
  t.nome = String(t.nome || "Torneio");
  t.criado = +t.criado || Date.now();
  t.cfg.games = Math.max(1, Math.min(11, Math.round(+t.cfg.games) || 5));
  t.cfg.quadras = Math.max(1, Math.round(+t.cfg.quadras) || 1);
  if(!CRITERIOS[t.cfg.criterio]) t.cfg.criterio = "games";
  if(["exato","maioria","corrida"].indexOf(t.cfg.regraFim) < 0) t.cfg.regraFim = "corrida";
  if(Array.isArray(t.cfg.desempate)){
    t.cfg.desempate = t.cfg.desempate.filter(k => CRIT_DEF[k] && k !== "alfa" && k !== t.cfg.criterio);
    if(!t.cfg.desempate.length) t.cfg.desempate = null;
  }
  return t;
}
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- rodízio: método do círculo + balanceamento ---------- */
function circulo(M){
  const rot = []; for(let i=1;i<M;i++) rot.push(i);
  const rodadas = [];
  for(let r=0;r<M-1;r++){
    const arr = [0, ...rot.slice(r), ...rot.slice(0,r)];
    const duplas = [];
    for(let i=0;i<M/2;i++) duplas.push([arr[i], arr[M-1-i]]);
    rodadas.push(duplas);
  }
  return rodadas;
}
function combinacoes(arr,k){
  const res=[]; (function go(ini,acc){
    if(acc.length===k){ res.push(acc.slice()); return; }
    for(let i=ini;i<arr.length;i++){ acc.push(arr[i]); go(i+1,acc); acc.pop(); }
  })(0,[]); return res;
}
function emparelhar(lista){
  if(lista.length===0) return [[]];
  const out=[]; const a=lista[0], resto=lista.slice(1);
  for(let i=0;i<resto.length;i++){
    const sub = resto.slice(0,i).concat(resto.slice(i+1));
    for(const m of emparelhar(sub)) out.push([[a,resto[i]], ...m]);
  }
  return out;
}
/* quantos jogos cabem numa rodada do rodízio: as duplas da rodada, aos pares
   (com número ímpar de atletas uma dupla sai, e com ímpar de duplas sobra uma) */
function jogosPorRodada(n){
  const duplas = n%2===0 ? n/2 : (n+1)/2 - 1;
  return Math.floor(duplas/2);
}
function rodizioUmaVez(n, maxRodadas, perm){
  const M = n%2===0 ? n : n+1, FANTASMA = n;
  const base = circulo(M);
  const total = Math.min(maxRodadas || M-1, M-1);
  const k = (a,b) => a<b ? a+"-"+b : b+"-"+a;
  const adv = {}, parc = {}, jogou = new Array(n).fill(0), folga = new Array(n).fill(0);
  const saida = [];
  for(let r=0;r<total;r++){
    const duplas = base[r].map(p => [p[0]===FANTASMA?FANTASMA:perm[p[0]], p[1]===FANTASMA?FANTASMA:perm[p[1]]])
                          .filter(p => p[0]!==FANTASMA && p[1]!==FANTASMA);
    const cap = Math.floor(duplas.length/2);
    let melhor = null, melhorCusto = Infinity;
    if(cap>0){
      const idx = duplas.map((_,i)=>i);
      for(const sel of combinacoes(idx, cap*2)){
        const depois = jogou.slice();
        for(const i of sel) for(const x of duplas[i]) depois[x]++;
        const media = depois.reduce((a,b)=>a+b,0)/n;
        const equil = depois.reduce((a,v)=>a+(v-media)*(v-media),0);
        for(const mm of emparelhar(sel)){
          let ca = 0;
          for(const par of mm){ for(const x of duplas[par[0]]) for(const y of duplas[par[1]]) ca += Math.pow(adv[k(x,y)]||0,2); }
          const custo = equil*100 + ca;
          if(custo<melhorCusto){ melhorCusto = custo; melhor = mm.map(par=>[duplas[par[0]], duplas[par[1]]]); }
        }
      }
    }
    const jogos = melhor || [];
    const emQuadra = new Set();
    jogos.forEach(m=>{
      m[0].concat(m[1]).forEach(x=>{ emQuadra.add(x); jogou[x]++; });
      for(const x of m[0]) for(const y of m[1]) adv[k(x,y)] = (adv[k(x,y)]||0)+1;
      parc[k(m[0][0],m[0][1])] = (parc[k(m[0][0],m[0][1])]||0)+1;
      parc[k(m[1][0],m[1][1])] = (parc[k(m[1][0],m[1][1])]||0)+1;
    });
    const folgados = [];
    for(let i=0;i<n;i++) if(!emQuadra.has(i)){ folgados.push(i); folga[i]++; }
    saida.push({ jogos, folgados });
  }
  const amplitude = Math.max(...jogou) - Math.min(...jogou);
  const repetidas = Object.values(parc).filter(v=>v>1).length;
  const advMax = Math.max(0, ...Object.values(adv));
  return { rodadas: saida, jogou, folga, nota: repetidas*10000 + amplitude*100 + advMax };
}
function gerarRodizio(n, maxRodadas, tentativas){
  let melhor = null;
  tentativas = tentativas || 30;
  for(let t=0;t<tentativas;t++){
    const perm = Array.from({length:n},(_,i)=>i);
    if(t>0) for(let i=perm.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const tmp=perm[i]; perm[i]=perm[j]; perm[j]=tmp; }
    const inv = new Array(n); perm.forEach((v,i)=>{ inv[v]=i; });
    const R = rodizioUmaVez(n, maxRodadas, inv);
    if(!melhor || R.nota < melhor.nota) melhor = R;
    if(melhor.nota === 0) break;
  }
  return melhor;
}

/* ---------- duplas fixas: todos contra todos ---------- */
function gerarTodosContraTodos(n, quadras){
  const M = n%2===0 ? n : n+1, FANTASMA = n;
  const base = circulo(M);
  const rodadas = [];
  for(const duplas of base){
    const confrontos = duplas.filter(p => p[0]!==FANTASMA && p[1]!==FANTASMA);
    const folgados = duplas.filter(p => p[0]===FANTASMA || p[1]===FANTASMA)
                           .map(p => p[0]===FANTASMA ? p[1] : p[0]);
    // respeita o nº de quadras: excedente vira rodada extra
    for(let i=0;i<confrontos.length;i+=quadras){
      const fatia = confrontos.slice(i, i+quadras);
      rodadas.push({ jogos: fatia.map(p=>[[p[0]],[p[1]]]), folgados: i===0 ? folgados : [] });
    }
  }
  return { rodadas };
}

/* ---------- mata-mata ---------- */
function ordemCabecas(tam){
  let ordem = [1,2];
  while(ordem.length < tam){
    const n = ordem.length*2, nova = [];
    for(const s of ordem){ nova.push(s); nova.push(n+1-s); }
    ordem = nova;
  }
  return ordem;
}
function gerarMataMata(ids){
  const n = ids.length;
  let tam = 2; while(tam < n) tam *= 2;
  const ordem = ordemCabecas(tam);
  const slots = ordem.map(s => s<=n ? ids[s-1] : null);   // null = bye
  const rodadas = [];
  let atual = [];
  for(let i=0;i<slots.length;i+=2) atual.push({ id:uid(), a:slots[i], b:slots[i+1], ga:null, gb:null, done:false });
  rodadas.push(atual);
  let qtd = atual.length;
  while(qtd > 1){
    qtd = qtd/2;
    const prox = [];
    for(let i=0;i<qtd;i++) prox.push({ id:uid(), a:null, b:null, ga:null, gb:null, done:false });
    rodadas.push(prox);
  }
  const ch = { rodadas };
  recalcularChave(ch);
  return ch;
}
function vencedorDe(m){
  if(m.a && !m.b) return m.a;                 // bye
  if(!m.a && m.b) return m.b;
  if(m.a && m.b && m.done && m.ga != null && m.ga !== m.gb) return m.ga > m.gb ? m.a : m.b;
  return null;                                 // empate não classifica ninguém
}
/* Reprocessa a chave inteira. Se o vencedor de um confronto muda, o jogo seguinte
   volta a ficar em aberto — senão o placar antigo ficaria colado em outra dupla. */
function recalcularChave(ch){
  for(let r=0;r<ch.rodadas.length-1;r++){
    ch.rodadas[r].forEach((m,i) => {
      if((m.a && !m.b) || (!m.a && m.b)){ m.done = true; m.bye = true; }
      const venc = vencedorDe(m);
      const alvo = ch.rodadas[r+1][Math.floor(i/2)];
      const campo = i % 2 === 0 ? "a" : "b";
      if(alvo[campo] !== venc){
        alvo[campo] = venc;
        if(alvo.done || alvo.ga != null){ alvo.done = false; alvo.ga = null; alvo.gb = null; alvo.live = null; }
      }
    });
  }
}
function campeao(ch){
  const f = ch.rodadas[ch.rodadas.length-1][0];
  return (f && f.a && f.b) ? vencedorDe(f) : null;
}

/* ---------- critérios de classificação ----------
   Escolher um critério principal empurra o outro para o desempate.
   A cadeia completa fica visível no app e no regulamento.            */
/* `exige` liga o critério ao estado do torneio:
   "completas"   → só vale se TODOS os jogos foram até a soma total de games;
   "incompletas" → só vale se pelo menos um jogo terminou antes disso.
   Os dois grupos são complementares: um vale exatamente quando o outro não vale. */
const CRIT_DEF = {
  games:    { rot:"Games ganhos",                        exige:"completas",   val:L => L.GP },
  vitorias: { rot:"Número de vitórias",                  val:L => L.V },
  h2hGP:    { rot:"Games ganhos no confronto direto",    exige:"completas",   entre:true, val:(L,c) => c.GP },
  h2hV:     { rot:"Vitórias no confronto direto",        entre:true, val:(L,c) => c.V },
  h2hD:     { rot:"Menos derrotas no confronto direto",  exige:"incompletas", entre:true, val:(L,c) => -c.D },
  derrotas: { rot:"Menos derrotas no torneio",           exige:"incompletas", val:L => -L.D },
  alfa:     { rot:"Ordem alfabética",                    alfabetica:true }
};
const CRITERIOS = {
  games: {
    nome: "Games ganhos", curto: "games",
    resumo: "Cada game vale 1 ponto. Como todo jogo tem a mesma quantidade de games, a soma é comparável entre todos.",
    regraFim: "exato",
    desempate: ["vitorias","h2hGP","h2hV","derrotas","h2hD"]
  },
  vitorias: {
    nome: "Vitórias", curto: "vitórias",
    resumo: "A coluna Pts é o próprio número de vitórias; empate vale meia vitória (0,5). O jogo pode ser encerrado assim que um lado garante a maioria dos games.",
    regraFim: "maioria",
    desempate: ["games","h2hGP","derrotas","h2hD"]
  }
};
/* O critério principal nunca é invalidado — ele define a pontuação da tabela. */
function jogosIncompletos(t){
  return todosJogos(t).filter(j => j.done && j.ga != null && (j.ga + j.gb) < t.cfg.games).length;
}
function criteriosAtivos(t){
  const inc = jogosIncompletos(t) > 0, ativos = {};
  Object.keys(CRIT_DEF).forEach(k => {
    const e = CRIT_DEF[k].exige;
    ativos[k] = !e || (e === "completas" ? !inc : inc);
  });
  ativos[t.cfg.criterio] = true;
  return ativos;
}
const criterioDe = t => CRITERIOS[t.cfg.criterio] || CRITERIOS.games;
/* cadeia efetiva: critério principal + desempates (reordenáveis) + ordem alfabética */
function cadeiaDe(t){
  const padrao = criterioDe(t).desempate;
  const meio = (t.cfg.desempate && t.cfg.desempate.length) ? t.cfg.desempate : padrao;
  return [t.cfg.criterio].concat(meio.filter(k => CRIT_DEF[k]), ["alfa"]);
}
const regraFim = t => t.modo === "mata" ? "corrida" : (t.cfg.regraFim || "corrida");
const maioriaGames = t => Math.floor(t.cfg.games/2) + 1;
function textoRegraFim(t){
  const n = t.cfg.games;
  const r = regraFim(t);
  if(r === "exato") return "Cada jogo tem exatamente " + n + " game" + (n>1?"s":"") + " — o placar sempre soma " + n + ".";
  if(r === "maioria") return "Jogo de até " + n + " games. Quem chega a " + maioriaGames(t)
    + " já garante a vitória, e aí o jogo pode ser encerrado — mas é opcional: dá para seguir até os " + n + ".";
  return "Vence quem chegar primeiro a " + n + " game" + (n>1?"s":"") + ".";
}
/* mesma frase com o "pode" em destaque, para deixar claro que é escolha do organizador */
function textoRegraFimHTML(t){
  return esc(textoRegraFim(t)).replace("pode ser encerrado", '<mark class="opc">pode</mark> ser encerrado');
}
/* o que encerrar cedo faz com a classificação */
function textoConsequencia(t){
  const r = regraFim(t), n = t.cfg.games;
  if(r === "maioria") return "Ao encerrar antes dos " + n + " games, os critérios que somam games saem da conta — "
    + "quem venceu rápido teria disputado menos games que os outros. No lugar deles entram os critérios de derrotas.";
  if(r === "exato") return "Encerrar um jogo antes dos " + n + " games desequilibra o critério principal, "
    + "porque esse atleta disputa menos games que os demais. Use só para W.O. ou interrupção.";
  return "";
}

/* ---------- classificação ---------- */
function confrontoDireto(grupo, jogos){
  const ids = new Set(grupo.map(L => L.id));
  const r = {}; grupo.forEach(L => { r[L.id] = { J:0, V:0, D:0, GP:0, GC:0 }; });
  jogos.forEach(j => {
    const A = j.a.filter(x => ids.has(x)), B = j.b.filter(x => ids.has(x));
    if(!A.length || !B.length) return;              // só vale quando os empatados se enfrentaram
    const reg = (lista, pro, contra) => lista.forEach(x => {
      const o = r[x]; o.J++; o.GP += pro; o.GC += contra;
      if(pro > contra) o.V++; else if(contra > pro) o.D++;
    });
    reg(A, j.ga, j.gb); reg(B, j.gb, j.ga);
  });
  return r;
}
function ordenarGrupo(grupo, cadeia, i, jogos){
  if(grupo.length <= 1 || i >= cadeia.length) return grupo.slice();
  const c = CRIT_DEF[cadeia[i]];
  if(c.alfabetica) return grupo.slice().sort((a,b) => a.nome.localeCompare(b.nome,"pt-BR"));
  const ctx = c.entre ? confrontoDireto(grupo, jogos) : null;
  const val = new Map(grupo.map(L => [L.id, c.val(L, ctx ? ctx[L.id] : null)]));
  const ord = grupo.slice().sort((a,b) => val.get(b.id) - val.get(a.id));
  const saida = []; let bloco = [ord[0]];
  for(let k=1;k<ord.length;k++){
    if(val.get(ord[k].id) === val.get(bloco[0].id)) bloco.push(ord[k]);
    else { saida.push.apply(saida, ordenarGrupo(bloco, cadeia, i+1, jogos)); bloco = [ord[k]]; }
  }
  saida.push.apply(saida, ordenarGrupo(bloco, cadeia, i+1, jogos));
  return saida;
}
function calcularClassificacao(t){
  const linhas = {};
  t.parts.forEach(p => { linhas[p.id] = { id:p.id, nome:p.nome, J:0, V:0, E:0, D:0, GP:0, GC:0 }; });
  const jogos = todosJogos(t).filter(j => j.done && j.ga!=null && j.gb!=null);
  jogos.forEach(j => {
    const lado = (ids, pro, contra) => ids.forEach(id => {
      const L = linhas[id]; if(!L) return;
      L.J++; L.GP += pro; L.GC += contra;
      if(pro > contra) L.V++; else if(contra > pro) L.D++; else L.E++;
    });
    lado(j.a, j.ga, j.gb); lado(j.b, j.gb, j.ga);
  });
  const lista = Object.values(linhas).map(L => {
    L.SG = L.GP - L.GC;
    L.PTS = t.cfg.criterio === "vitorias" ? (L.V + L.E * 0.5) : L.GP;
    return L;
  });
  const ativos = criteriosAtivos(t);
  const ordenada = ordenarGrupo(lista, cadeiaDe(t).filter(k => ativos[k]), 0, jogos);
  ordenada.forEach((L,i) => { L.pos = i+1; });
  return ordenada;
}
function todosJogos(t){
  if(t.modo === "mata"){
    const out = [];
    (t.chave ? t.chave.rodadas : []).forEach(r => r.forEach(m => {
      if(m.a && m.b) out.push({ id:m.id, a:[m.a], b:[m.b], ga:m.ga, gb:m.gb, done:m.done });
    }));
    return out;
  }
  const out = [];
  (t.rodadas||[]).forEach(r => r.jogos.forEach(j => out.push(j)));
  return out;
}
/* No mata-mata os confrontos futuros só existem depois que a chave se define,
   mas o total de jogos é sempre participantes − 1. */
function totalDeJogos(t){
  return t.modo === "mata" ? Math.max(0, t.parts.length - 1) : todosJogos(t).length;
}
/* pontos podem ter meia unidade (empate); mostra 5 e 5,5, nunca 5,0 */
const fmtPts = v => (Math.round(v * 2) % 2 === 0) ? String(Math.round(v)) : (Math.floor(v) + ",5");
const nomeDe = (t,id) => { const p = t.parts.find(x => x.id===id); return p ? p.nome : "?"; };
const nomesLado = (t,ids) => ids.map(id => nomeDe(t,id)).join("  +  ");

/* ---------- criação de torneio ---------- */
function criarTorneio(dados){
  const t = {
    id: uid(), nome: dados.nome, modo: dados.modo, criado: Date.now(),
    parts: dados.nomes.map(n => ({ id:uid(), nome:n })),
    cfg: {
      quadras: dados.quadras, rodadas: dados.rodadas, games: dados.games,
      pontoOuro: dados.pontoOuro, criterio: dados.criterio,
      regraFim: dados.modo === "mata" ? "corrida" : (CRITERIOS[dados.criterio] || CRITERIOS.games).regraFim,
      desempate: (dados.desempate && dados.desempate.length)
        ? dados.desempate.slice()
        : (CRITERIOS[dados.criterio] || CRITERIOS.games).desempate.slice()
    },
    rodadas: [], chave: null, regras: null
  };
  gerarChave(t);
  return t;
}
/* ---------- distribuição das quadras ----------
   Qual jogo da rodada vai para qual quadra não muda nada na chave — então as
   quadras são escolhidas para que cada participante alterne o máximo possível
   entre elas: com 2 quadras, metade dos jogos em cada uma; com 3, um terço em
   cada; e assim por diante, arredondando quando não divide certo.
   O critério é a soma dos quadrados dos jogos por quadra de cada um, que é
   mínima justamente quando a repartição fica o mais igual possível. Nem sempre
   dá para todo mundo ficar no ideal ao mesmo tempo — quem joga com quem em cada
   rodada já está fechado —, daí a busca: várias distribuições sorteadas, cada
   uma refinada por trocas, e no fim fica a melhor. */
function equilibrarQuadras(t){
  const Q = Math.max(1, Math.round(+t.cfg.quadras) || 1);
  if(Q < 2 || !t.rodadas.length) return;
  const idx = {};
  t.parts.forEach((p,i) => { idx[p.id] = i; });
  /* o algoritmo só precisa de quem joga cada jogo, não do jogo inteiro */
  const rodadas = t.rodadas.map(r => r.jogos.map(j => j.a.concat(j.b).map(id => idx[id]).filter(i => i != null)));
  const nP = t.parts.length;

  /* soma de quadrados que existiria se cada um repartisse seus jogos exatamente
     entre as quadras: é um piso, nem sempre alcançável, e serve para parar a
     busca assim que ela chega lá */
  const meus = new Array(nP).fill(0);
  rodadas.forEach(r => r.forEach(g => g.forEach(i => { meus[i]++; })));
  const ideal = meus.reduce((s,v) => {
    const base = Math.floor(v/Q), resto = v%Q;
    return s + resto*(base+1)*(base+1) + (Q-resto)*base*base;
  }, 0);

  /* as quadras de uma rodada: cada uma repetida tantas vezes quantas levas de
     jogos a rodada tiver, para uma sobrar no máximo uma vez a mais que a outra */
  const vagas = g => {
    const base = Math.floor(g/Q), resto = g%Q, out = [];
    for(let q=0;q<Q;q++) for(let k=0;k<base+(q<resto?1:0);k++) out.push(q);
    return out;
  };
  const quantos = (pl,q) => { let c = 0; for(const x of pl) if(x === q) c++; return c; };

  const cont = [];
  for(let i=0;i<nP;i++) cont.push(new Array(Q).fill(0));
  const poe = (g,q,d) => { for(const p of g) cont[p][q] += d; };
  /* quanto a soma dos quadrados muda ao levar um jogo da quadra a para a b */
  const delta = (g,a,b) => { let d = 0; for(const p of g) d += 2*(cont[p][b] - cont[p][a]) + 2; return d; };
  /* empates também passam, às vezes: o custo tem muitos platôs, e andar de lado
     neles é o que destrava as trocas que melhoram de verdade */
  const aceita = d => d < 0 || (d === 0 && Math.random() < 0.5);
  const baralha = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const x=a[i]; a[i]=a[j]; a[j]=x; } return a; };

  let melhor = null, melhorCusto = Infinity;
  for(let tent=0; tent<120 && melhorCusto > ideal; tent++){
    for(const c of cont) c.fill(0);
    const plano = rodadas.map(r => new Array(r.length).fill(0));
    let custo = 0;

    /* 1) primeira distribuição: cada jogo pega a quadra menos usada pelos seus */
    rodadas.forEach((r, ri) => {
      const livres = vagas(r.length);
      const ordem = r.map((_,i)=>i);
      if(tent > 0){ baralha(ordem); baralha(livres); }
      ordem.forEach(gi => {
        const g = r[gi];
        let escolha = 0, menor = Infinity;
        livres.forEach((q,i) => {
          let c = 0; for(const p of g) c += cont[p][q];
          if(c < menor){ menor = c; escolha = i; }
        });
        const q = livres.splice(escolha,1)[0];
        plano[ri][gi] = q;
        for(const p of g) custo += 2*cont[p][q] + 1;
        poe(g, q, 1);
      });
    });

    /* 2) refina olhando o torneio inteiro, e não só as rodadas já distribuídas:
          troca as quadras de dois jogos da mesma rodada, ou move um jogo para
          uma quadra que ficou vaga naquela rodada */
    let parado = 0;
    for(let passo=0; passo<60; passo++){
      let mexeu = false;
      for(let ri=0; ri<rodadas.length; ri++){
        const r = rodadas[ri], pl = plano[ri];
        for(let i=0;i<r.length;i++){
          for(let q=0;q<Q;q++){
            if(q === pl[i] || quantos(pl,q) >= quantos(pl,pl[i])) continue;
            const d = delta(r[i], pl[i], q);
            if(aceita(d)){ poe(r[i], pl[i], -1); poe(r[i], q, 1); pl[i] = q; custo += d; if(d < 0) mexeu = true; }
          }
          for(let k=i+1;k<r.length;k++){
            const a = pl[i], b = pl[k];
            const d = delta(r[i], a, b) + delta(r[k], b, a);
            if(aceita(d)){
              poe(r[i], a, -1); poe(r[k], b, -1); poe(r[i], b, 1); poe(r[k], a, 1);
              pl[i] = b; pl[k] = a; custo += d; if(d < 0) mexeu = true;
            }
          }
        }
      }
      if(mexeu) parado = 0; else if(++parado >= 4) break;
    }
    if(custo < melhorCusto){ melhorCusto = custo; melhor = plano.map(x => x.slice()); }
  }

  t.rodadas.forEach((r, ri) => {
    r.jogos.forEach((j, i) => { j.quadra = melhor[ri][i] + 1; });
    /* na tela: primeiro a leva que ocupa todas as quadras, depois a seguinte */
    const usos = {};
    const marcado = r.jogos.map(j => ({ j, onda: (usos[j.quadra] = (usos[j.quadra]||0) + 1) }));
    marcado.sort((x,y) => (x.onda - y.onda) || (x.j.quadra - y.j.quadra));
    r.jogos = marcado.map(x => x.j);
  });
}
function gerarChave(t){
  const n = t.parts.length;
  const Q = Math.max(1, Math.round(+t.cfg.quadras) || 1);
  if(t.modo === "rodizio"){
    const R = gerarRodizio(n, t.cfg.rodadas);
    t.rodadas = R.rodadas.map((r,i) => ({
      n: i+1,
      jogos: r.jogos.map((m,q) => ({ id:uid(), quadra:(q%Q)+1, a:m[0].map(x=>t.parts[x].id), b:m[1].map(x=>t.parts[x].id), ga:null, gb:null, done:false })),
      folgados: r.folgados.map(x => t.parts[x].id)
    }));
    t.chave = null;
  } else if(t.modo === "duplas"){
    const R = gerarTodosContraTodos(n, t.cfg.quadras);
    t.rodadas = R.rodadas.map((r,i) => ({
      n: i+1,
      jogos: r.jogos.map((m,q) => ({ id:uid(), quadra:(q%Q)+1, a:m[0].map(x=>t.parts[x].id), b:m[1].map(x=>t.parts[x].id), ga:null, gb:null, done:false })),
      folgados: r.folgados.map(x => t.parts[x].id)
    }));
    t.chave = null;
  } else {
    t.rodadas = [];
    t.chave = gerarMataMata(t.parts.map(p => p.id));
  }
  if(t.modo !== "mata"){ equilibrarQuadras(t); t.cfg.qeq = 1; }
}
const MODOS = {
  rodizio: { nome:"Rodízio individual", curto:"Super N", desc:"Cada atleta joga com um parceiro diferente a cada rodada. Pontuação individual." },
  duplas:  { nome:"Duplas fixas",       curto:"Todos x todos", desc:"Duplas fixas, todos contra todos. Classificação por dupla." },
  mata:    { nome:"Mata-mata",          curto:"Eliminatória",  desc:"Chave eliminatória simples, com byes automáticos." }
};
</script>

<script>
"use strict";
/* ============================ INTERFACE ============================ */
const $ = s => document.querySelector(s);
const view = $("#view"), modais = $("#modais");
let toastT = null;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(()=> el.classList.remove("on"), 2200);
}
const ativo = () => DB.torneios.find(t => t.id === DB.ativo) || null;

/* ---------------- instalação no celular ---------------- */
const VERSAO = "1.0";
const EH_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const instalado = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let promptInstalar = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalar = e; if(DB.tab === "torneios") render(); });
window.addEventListener("appinstalled", () => { promptInstalar = null; toast("App instalado!"); if(DB.tab === "torneios") render(); });

/* chamada pelo registrador do service worker quando chega versão nova */
window.avisarAtualizacao = function(aplicar){
  if(document.querySelector(".atualiza")) return;
  const el = document.createElement("div");
  el.className = "atualiza";
  el.innerHTML = '<span class="txt">Versão nova do app disponível.</span>'
    + '<button id="atOk">Atualizar</button>'
    + '<button class="fechar" id="atNao" aria-label="Agora não">✕</button>';
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add("on"));
  el.querySelector("#atOk").addEventListener("click", ()=>{ (aplicar || (()=>location.reload()))(); });
  el.querySelector("#atNao").addEventListener("click", ()=>{ el.classList.remove("on"); setTimeout(()=>el.remove(), 250); });
};

/* ---------------- tema ---------------- */
function aplicarTema(){
  const r = document.documentElement;
  if(DB.tema === "dark" || DB.tema === "light") r.setAttribute("data-theme", DB.tema);
  else r.removeAttribute("data-theme");
}
$("#btnTema").addEventListener("click", ()=>{
  DB.tema = DB.tema === "light" ? "dark" : DB.tema === "dark" ? null : "light";
  aplicarTema(); salvar();
  toast(DB.tema === "light" ? "Tema claro" : DB.tema === "dark" ? "Tema escuro" : "Tema do sistema");
});

/* ---------------- navegação ---------------- */
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", ()=>{
  DB.tab = b.dataset.tab; salvar(); render();
}));
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(folha.classList.contains("ver")) return fecharFolha();
  if(modais.firstChild) fecharModal();
});

/* o espaço livre depende da fonte carregada e das áreas seguras do aparelho, então é medido */
function medirEspaco(){
  const topo = document.querySelector(".top"), abas = document.querySelector(".tabs");
  if(!topo || !abas) return;
  const livre = window.innerHeight - topo.offsetHeight - abas.offsetHeight;
  document.documentElement.style.setProperty("--livre", Math.max(240, livre) + "px");
}
window.addEventListener("resize", medirEspaco);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(medirEspaco);

function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === DB.tab));
  const t = ativo();
  $("#topTitle").textContent = t ? t.nome : "Super N";
  $("#topSub").textContent = t ? (MODOS[t.modo].curto + " · " + t.parts.length + (t.modo==="rodizio" ? " atletas" : " duplas")) : "Beach Tennis";
  window.scrollTo(0,0);
  if(DB.tab === "torneios") view.innerHTML = telaTorneios();
  else if(DB.tab === "chave") view.innerHTML = telaChave();
  else if(DB.tab === "classificacao") view.innerHTML = telaClassificacao();
  else view.innerHTML = telaRegras();
  ligarAcoes();
  medirEspaco();
}

/* ---------------- tela: torneios ---------------- */
function telaTorneios(){
  const lista = DB.torneios.slice().sort((a,b)=> b.criado - a.criado);
  let h = '<div class="sec"><button class="btn pri blk" data-acao="novo">+ Novo torneio</button></div>';
  if(!lista.length){
    h += '<div class="vazio card"><div class="big">🏐</div><h2 style="font-size:18px;margin-bottom:6px">Nenhum torneio ainda</h2>'
       + '<p class="small">Crie um torneio de 4 a 16 participantes e o app monta a chave, sorteia as duplas e cuida da pontuação.</p></div>';
  } else {
    h += '<div class="sec"><h2>Meus torneios</h2><div class="lista">';
    lista.forEach(t => {
      const total = totalDeJogos(t), feitos = todosJogos(t).filter(j=>j.done).length;
      const camp = t.modo === "mata" && t.chave ? campeao(t.chave) : null;
      const lider = t.modo !== "mata" && feitos ? calcularClassificacao(t)[0] : null;
      h += '<div class="item" data-abrir="'+t.id+'" role="button" tabindex="0">'
        +   '<div class="num">'+t.parts.length+'</div>'
        +   '<div class="grow"><div style="font-weight:800;line-height:1.2">'+esc(t.nome)+'</div>'
        +     '<div class="small muted">'+MODOS[t.modo].nome+' · '+feitos+'/'+total+' jogos'
        +     (camp ? ' · 🏆 '+esc(nomeDe(t,camp)) : lider && feitos ? ' · 1º '+esc(lider.nome) : '')+'</div></div>'
        +   '<span class="tag '+(feitos===total && total ? 'ok' : 'ceu')+'">'+(feitos===total && total ? 'fim' : (feitos? 'em jogo':'novo'))+'</span>'
        + '</div>';
    });
    h += '</div></div>';
  }
  h += '<div class="sec"><h2>Dados</h2><div class="row" style="gap:8px">'
    +  '<button class="btn sm grow" data-acao="exportar">Exportar (copiar)</button>'
    +  '<button class="btn sm grow" data-acao="importar">Importar (colar)</button></div>'
    +  '<p class="small muted" style="margin-top:8px">Tudo fica salvo no próprio aparelho, funciona sem internet.</p></div>';

  h += '<div class="sec"><h2>Ajuda</h2><div class="lista">';
  if(!instalado()) h += linhaAjuda("instalar", "📲", "Instalar no celular",
    EH_IOS ? "Ícone na tela inicial, sem barra do navegador" : "Vira app de verdade, com ícone e uso offline", false);
  h += linhaAjuda("dados", "🔒", "Onde ficam os seus torneios",
    EH_IOS ? "Importante no iPhone: como não perder os dados" : "Como fazer cópia e não perder nada", !DB.viuDados);
  h += linhaAjuda("sobre", "🏐", "Sobre o app", "Versão " + VERSAO + " · offline · sem cadastro", false);
  h += '</div></div>';

  h += '<div class="creditos">'
    +  '<div class="rule"><span class="ball" style="width:20px;height:20px" aria-hidden="true"></span></div>'
    +  '<div class="cap">feito por</div><div class="nome">Jaber Felippe Neto</div>'
    +  '<span class="ver">Super N Beach Tennis · v'+VERSAO+'</span></div>';
  return h;
}
function linhaAjuda(acao, icone, titulo, sub, destaque){
  return '<button class="item acao" data-acao="'+acao+'">'
    + '<span class="ico" aria-hidden="true">'+icone+'</span>'
    + '<span class="grow"><span style="display:block;font-weight:800;line-height:1.2">'+esc(titulo)+'</span>'
    +   '<span class="small muted" style="display:block">'+esc(sub)+'</span></span>'
    + (destaque ? '<span class="pontinho" aria-label="não lido"></span>' : '<span class="muted" style="font-size:18px">›</span>')
    + '</button>';
}

/* ---------------- tela: chave ---------------- */
function telaChave(){
  const t = ativo();
  if(!t) return semTorneio("Crie um torneio para ver a chave.");
  if(t.modo === "mata") return chaveMataMata(t);

  const rs = t.rodadas;
  if(!t.rodadaAtual || t.rodadaAtual > rs.length) t.rodadaAtual = 1;
  const vista = DB.vistaChave === "tabela" ? "tabela" : "rodadas";
  let h = '<div class="sec"><div class="seg">'
    + '<button class="'+(vista==="rodadas"?"on":"")+'" data-vista-chave="rodadas">Rodada a rodada</button>'
    + '<button class="'+(vista==="tabela"?"on":"")+'" data-vista-chave="tabela">Tabela de jogos</button></div>';
  if(vista === "tabela") return h + tabelaJogos(t) + '</div>' + blocoAjustes(t);
  const r = rs[t.rodadaAtual-1];
  h += '<div class="pillrow" style="overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px">';
  rs.forEach(x => {
    const completa = x.jogos.every(j=>j.done);
    h += '<button class="pill'+(x.n===t.rodadaAtual?' on':'')+'" data-rodada="'+x.n+'" style="flex:none">R'+x.n+(completa?' ✓':'')+'</button>';
  });
  h += '</div></div>';
  const Q = Math.max(1, +t.cfg.quadras || 1), levas = Math.ceil(r.jogos.length / Q);
  h += '<div class="sec"><h2>Rodada '+r.n+' de '+rs.length+'</h2>';
  if(levas > 1) h += '<div class="bye">⏱ <span>Esta rodada tem '+r.jogos.length+' jogos para '+Q+' quadra'+(Q>1?'s':'')
    + ': eles acontecem em '+levas+' levas, uma depois da outra.</span></div>';
  r.jogos.forEach((j,i) => { h += cardJogo(t, j, levas > 1 ? Math.floor(i/Q)+1 : 0); });
  if(r.folgados.length) h += '<div class="bye">💤 <span><b>Descansa:</b> '+esc(r.folgados.map(id=>nomeDe(t,id)).join(", "))+'</span></div>';
  h += '<div class="row" style="margin-top:12px">'
    +  '<button class="btn grow" data-acao="rodada-ant"'+(t.rodadaAtual<=1?' disabled':'')+'>← Anterior</button>'
    +  '<button class="btn azul grow" data-acao="rodada-prox"'+(t.rodadaAtual>=rs.length?' disabled':'')+'>Próxima →</button></div>';
  h += '</div>' + blocoAjustes(t);
  return h;
}
/* como as quadras ficaram divididas — o ideal nem sempre cabe na chave */
function notaQuadras(t){
  const Q = t.cfg.quadras;
  if(Q < 2) return "";
  const cont = {};
  t.parts.forEach(p => { cont[p.id] = new Array(Q).fill(0); });
  t.rodadas.forEach(r => r.jogos.forEach(j => j.a.concat(j.b).forEach(id => { if(cont[id]) cont[id][j.quadra-1]++; })));
  let fora = 0, pior = 0;
  t.parts.forEach(p => {
    const c = cont[p.id], v = c.reduce((a,b)=>a+b,0);
    const piso = Math.floor(v/Q), teto = Math.ceil(v/Q);
    let d = 0;
    c.forEach(x => { d = Math.max(d, x - teto, piso - x); });
    if(d > 0){ fora++; pior = Math.max(pior, d); }
  });
  const base = '<b>Quadras revezadas:</b> os jogos de cada rodada são distribuídos para todo mundo alternar de quadra o máximo possível';
  if(fora === 0) return base + ' — nesta chave deu certo para todos (quando o número de jogos não divide pelas quadras, a sobra fica com uma delas).';
  return base + ', mas com esta chave ' + (fora === 1 ? '1 participante ficou' : fora + ' participantes ficaram')
    + ' com ' + (pior === 1 ? 'um jogo' : pior + ' jogos') + ' a mais numa quadra do que o ideal: foi a melhor divisão encontrada para esta chave.';
}
/* todos os jogos do torneio numa tabela só, no formato da súmula de arena */
function tabelaJogos(t){
  const rs = t.rodadas;
  if(!rs.length) return '<p class="muted">Sem jogos para exibir.</p>';
  let h = '<div class="tblwrap"><table class="sumula"><thead><tr><th>#</th>'
    + '<th style="text-align:left">Dupla A</th><th>Placar</th><th style="text-align:right">Dupla B</th>'
    + '</tr></thead><tbody>';
  let n = 0;
  rs.forEach(r => {
    const completa = r.jogos.length > 0 && r.jogos.every(j=>j.done);
    h += '<tr class="rd"><td colspan="4">Rodada '+r.n+(completa?' ✓':'')
      + (r.folgados.length ? ' <span class="fg">· descansa: '+esc(r.folgados.map(id=>nomeDe(t,id)).join(", "))+'</span>' : '')
      + '</td></tr>';
    r.jogos.forEach(j => {
      n++;
      const A = nomesLado(t,j.a), B = nomesLado(t,j.b);
      const feito = j.done && j.ga != null;
      const vA = feito && j.ga > j.gb, vB = feito && j.gb > j.ga;
      const g = (v,win,nd) => '<span class="g'+(win?' win':'')+(nd?' nd':'')+'">'+v+'</span>';
      let placar, situacao;
      if(feito){ placar = g(j.ga,vA)+'<i>×</i>'+g(j.gb,vB); situacao = j.ga+' a '+j.gb; }
      else if(j.live){ placar = g(j.live.ga||0)+'<i>×</i>'+g(j.live.gb||0)+'<span class="aov">ao vivo</span>'; situacao = "ao vivo"; }
      else { placar = g("–",false,true)+'<i>×</i>'+g("–",false,true); situacao = "a jogar"; }
      h += '<tr class="jg" data-placar="'+j.id+'" role="button" tabindex="0" aria-label="'
        +   esc('Jogo '+n+', quadra '+j.quadra+': '+A+' contra '+B+', '+situacao+'. Tocar para lançar o placar.')+'">'
        + '<td class="nj">'+n+'<span>Q'+j.quadra+'</span></td>'
        + '<td class="eq'+(vA?' venc':'')+'">'+esc(A)+'</td>'
        + '<td class="pl">'+placar+'</td>'
        + '<td class="eq dir'+(vB?' venc':'')+'">'+esc(B)+'</td></tr>';
    });
  });
  h += '</tbody></table></div>';
  h += '<p class="small muted" style="margin-top:8px">Todos os jogos do torneio, na ordem das rodadas. '
    +  '<b>Q1, Q2…</b> é a quadra em que o jogo acontece. Toque numa linha para lançar ou corrigir aquele placar '
    +  '— o placar ao vivo fica na visão <b>Rodada a rodada</b>.</p>';
  const nota = notaQuadras(t);
  if(nota) h += '<p class="small muted" style="margin-top:6px">' + nota + '</p>';
  return h;
}
function cardJogo(t,j,leva){
  const A = nomesLado(t,j.a), B = nomesLado(t,j.b);
  const feito = j.done && j.ga!=null;
  return '<div class="jogo">'
    + '<div class="cab"><span>Quadra '+j.quadra+(leva ? ' · '+leva+'ª leva' : '')+'</span><span class="grow"></span>'
    +   (feito ? '<span class="tag ok">encerrado</span>' : (j.live ? '<span class="tag bola">ao vivo</span>' : '<span class="tag ceu">a jogar</span>'))+'</div>'
    + '<div class="quadra"><div class="lado"><div class="nome">'+esc(A)+'</div></div><div class="rede"></div>'
    +   '<div class="lado dir"><div class="nome">'+esc(B)+'</div></div></div>'
    + '<div class="placar"><div class="gm '+(feito&&j.ga>j.gb?'win':'')+'">'+(feito?j.ga:'–')+'</div><div class="x">×</div>'
    +   '<div class="gm '+(feito&&j.gb>j.ga?'win':'')+'">'+(feito?j.gb:'–')+'</div></div>'
    + '<div class="acoes"><button class="btn sm" data-live="'+j.id+'">▶ Placar ao vivo</button>'
    +   '<button class="btn sm '+(feito?'':'pri')+'" data-placar="'+j.id+'">'+(feito?'Editar placar':'Lançar placar')+'</button></div>'
    + '</div>';
}
function blocoAjustes(t){
  return '<div class="sec"><h2>Torneio</h2><div class="card">'
    + '<div class="small muted" style="margin-bottom:6px">'+MODOS[t.modo].nome+' · '+t.parts.length+' participantes · '
    + t.cfg.quadras+' quadra(s) · ponto de ouro</div>'
    + '<div class="small muted" style="margin-bottom:10px">'+esc(textoRegraFim(t))
    + (t.modo!=="mata" ? ' Classificação por '+criterioDe(t).curto+'.' : '')+'</div>'
    + '<div class="row" style="flex-wrap:wrap;gap:7px">'
    + '<button class="btn sm" data-acao="renomear">Renomear</button>'
    + '<button class="btn sm" data-acao="participantes">Participantes</button>'
    + (t.modo!=="mata" ? '<button class="btn sm" data-acao="sortear">Sortear de novo</button>' : '')
    + '<button class="btn sm" data-acao="pdf">Exportar PDF</button>'
    + '<button class="btn sm danger" data-acao="excluir">Excluir</button>'
    + '</div></div></div>';
}
function chaveMataMata(t){
  const rods = t.chave.rodadas, tam = rods[0].length*2;
  const nomeRodada = i => {
    const faltam = rods.length - 1 - i;
    return faltam===0 ? "Final" : faltam===1 ? "Semifinal" : faltam===2 ? "Quartas" : faltam===3 ? "Oitavas" : "Rodada "+(i+1);
  };
  const camp = campeao(t.chave);
  let h = "";
  if(camp) h += '<div class="sec"><div class="card center" style="background:linear-gradient(180deg,var(--ceu-claro),var(--superf))">'
    + '<div style="font-size:34px">🏆</div><div class="small muted" style="letter-spacing:.1em;text-transform:uppercase;font-weight:800">Campeão</div>'
    + '<h2 style="font-size:22px;margin-top:4px">'+esc(nomeDe(t,camp))+'</h2></div></div>';
  h += '<div class="sec"><h2>Chave · '+tam+' vagas</h2><div class="bracket">';
  rods.forEach((r,i)=>{
    h += '<div class="bcol"><h3>'+nomeRodada(i)+'</h3>';
    r.forEach(m => {
      const jog = (id,sc,venc) => '<div class="bteam'+(venc?' w':'')+(id?'':' vazio')+'"><span class="grow">'+(id?esc(nomeDe(t,id)):"a definir")+'</span><span class="sc">'+(sc==null?"":sc)+'</span></div>';
      const vencA = m.done && m.a && m.b && m.ga>m.gb, vencB = m.done && m.a && m.b && m.gb>m.ga;
      h += '<div class="bmatch" '+(m.a&&m.b?'data-placar="'+m.id+'" role="button" tabindex="0"':'')+'>'
        + jog(m.a, m.ga, vencA || (m.a && !m.b)) + jog(m.b, m.gb, vencB || (!m.a && m.b)) + '</div>';
    });
    h += '</div>';
  });
  h += '</div><p class="small muted">Toque em um confronto para lançar o placar. Quem vence avança automaticamente.</p></div>';
  return h + blocoAjustes(t);
}
function semTorneio(msg){
  return '<div class="vaziowrap"><div class="vazio card"><div class="big">🎾</div><p>'+esc(msg)+'</p>'
    + '<button class="btn pri" data-acao="novo" style="margin-top:10px">+ Novo torneio</button></div></div>';
}

/* ---------------- tela: classificação ---------------- */
function jogosEncerradosCedo(t){
  return todosJogos(t).filter(j => j.done && j.ga!=null && (j.ga + j.gb) < t.cfg.games).length;
}
function cadeiaListaHTML(t, meio, editavel){
  const itens = [{k:t.cfg.criterio, fixo:true}]
    .concat(meio.map(k => ({ k:k })))
    .concat([{ k:"alfa", fixo:true }]);

function ligarReorder(raiz, meio, aoMudar){
  raiz.querySelectorAll("[data-mv]").forEach(b => b.addEventListener("click", ()=>{
    const i = +b.dataset.i, j = i + (b.dataset.mv === "up" ? -1 : 1);
    if(j < 0 || j >= meio.length) return;
    const tmp = meio[i]; meio[i] = meio[j]; meio[j] = tmp;
    aoMudar();
  }));
}

function md(txt){
  const linhas = String(txt).split("\n"); let h = "", lista = false;
  const fecha = () => { if(lista){ h += "</ul>"; lista = false; } };
  linhas.forEach(l => {
    const s = l.trim();
    if(!s){ fecha(); return; }
    if(s.startsWith("## ")){ fecha(); h += "<h3>"+esc(s.slice(3))+"</h3>"; }
    else if(s.startsWith("- ")){ if(!lista){ h += "<ul>"; lista = true; } h += "<li>"+esc(s.slice(2))+"</li>"; }
    else { fecha(); h += "<p>"+esc(s)+"</p>"; }
  });
  fecha(); return h;
}

function regulamentoPadrao(t){
  const n = t.parts.length, c = t.cfg;
  const linhas = [];
  linhas.push("## Formato");
  if(t.modo === "rodizio"){
    linhas.push(n+" atletas jogam individualmente, mas as duplas mudam a cada rodada — ninguém repete parceiro enquanto houver combinação nova.");
    linhas.push("- Rodadas: "+t.rodadas.length+"  ·  Jogos: "+totalDeJogos(t)+"  ·  Quadras simultâneas: "+c.quadras);
    linhas.push("- Quem descansa na rodada está indicado na chave.");
    const porRodada = Math.max(...t.rodadas.map(r => r.jogos.length), 0);
    if(porRodada > c.quadras) linhas.push("- Cada rodada tem mais jogos que quadras, então os jogos da rodada saem em levas, uma depois da outra.");
  } else if(t.modo === "duplas"){
    linhas.push(n+" duplas fixas, todos contra todos.");
    linhas.push("- Rodadas: "+t.rodadas.length+"  ·  Jogos: "+totalDeJogos(t)+"  ·  Quadras simultâneas: "+c.quadras);
  } else {
    linhas.push(n+" duplas em chave eliminatória simples. Quem perde está fora.");
    linhas.push("- Duplas sorteadas em posição ímpar avançam direto quando a chave tem bye.");
  }
  linhas.push("");
  linhas.push("## Cada jogo");
  linhas.push("- "+textoRegraFim(t));
  if(textoConsequencia(t)) linhas.push("- "+textoConsequencia(t));
  linhas.push("- Contagem do game: 15, 30, 40, game. No 40-40 o próximo ponto decide (ponto de ouro), sem vantagem.");
  linhas.push("- Sem tie-break.");
  if(regraFim(t) === "exato") linhas.push("- Todos os jogos têm a mesma quantidade de games, então empate no placar é resultado normal.");
  if(regraFim(t) === "maioria") linhas.push("- Encerrar o jogo na maioria é opcional: as duplas podem seguir até os "+c.games+" games se quiserem.");
  linhas.push("");
  if(t.modo !== "mata"){
    const crit = criterioDe(t);
    linhas.push("## Classificação");
    linhas.push("Critério principal: "+crit.nome+". "+crit.resumo);
    linhas.push("Ordem completa, do primeiro ao último desempate:");
    cadeiaDe(t).forEach((k,i) => linhas.push("- "+(i+1)+". "+CRIT_DEF[k].rot));
    linhas.push("Confronto direto considera apenas os jogos entre os empatados, e é recalculado a cada empate — inclusive quando três ou mais estão na mesma pontuação.");
    if(crit.nota) linhas.push(crit.nota);
    linhas.push("");
  }
  linhas.push("## Bola, rede e quadra");
  linhas.push("- Rede a 1,70 m do solo (adulto). Bola de beach tennis (pressão reduzida, estágio 2).");
  linhas.push("- Saque por baixo ou por cima, direto, sem quique. Uma tentativa de saque por ponto quando o regulamento adotar saque único.");
  linhas.push("- A bola não pode quicar: o ponto é disputado no ar (voleio). Bola que toca a areia é ponto do adversário.");
  linhas.push("- Bola na linha é dentro. Bola que toca a rede e cai na quadra adversária segue em jogo.");
  linhas.push("");
  linhas.push("## Conduta e organização");
  linhas.push("- Tolerância de 10 minutos para o início de cada jogo; após isso, W.O. e o placar cheio para o adversário presente.");
  linhas.push("- Os próprios atletas marcam os pontos; em caso de dúvida, repete-se o ponto.");
  linhas.push("- O organizador do evento decide os casos omissos.");
  return linhas.join("\n");
}

      + '<td><b>'+fmtPts(L.PTS)+'</b></td><td>'+L.J+'</td><td>'+L.V+'</td><td>'+L.E+'</td><td>'+L.D+'</td>'
      + cols.map(c => '<td>'+extra[c]+'</td>').join("")+'</tr>';
  });
  return h + '</tbody></table>'
    + '<p class="fnota">Pts = '+(porGames ? "games ganhos" : "1 por vitória, 0,5 por empate")
    + ' · J/V/E/D = jogos, vitórias, empates, derrotas · GP/GC = games pró e contra · SG = saldo.</p>';
}
function folhaCriterios(t){
  const cad = cadeiaDe(t), ativos = criteriosAtivos(t);
  let h = '<ol class="fcrit">';
  cad.forEach((k,i) => {
    const d = CRIT_DEF[k]; if(!d) return;
    const inativo = !ativos[k];
    h += '<li'+(inativo ? ' class="some"' : '')+'><b>'+(i+1)+'.</b>'+esc(d.rot)
      + (i===0 ? ' <i>— critério principal</i>' : '')
      + (inativo ? ' <i>— fora nesta chave</i>' : '')+'</li>';
  });
  h += '</ol>';
  h += '<p class="fnota">Empate no critério 1 vai para o 2, e assim por diante. <b>Confronto direto</b> olha só '
    +  'os jogos entre os empatados e é recalculado dentro de cada empate. Os critérios de <b>games</b> só valem '
    +  'quando todos os jogos foram até os '+t.cfg.games+' games; os de <b>derrotas</b> valem quando algum jogo '
    +  'terminou antes disso — um grupo liga quando o outro desliga.</p>';
  return h;
}
function folhaMataMata(t){
  const rods = t.chave.rodadas;
  const nomeRodada = i => {
    const faltam = rods.length - 1 - i;
    return faltam===0 ? "Final" : faltam===1 ? "Semifinal" : faltam===2 ? "Quartas" : faltam===3 ? "Oitavas" : "Rodada "+(i+1);
  };
  let h = '<div class="fchave">';
  rods.forEach((r,i) => {
    h += '<div class="bc"><h3>'+nomeRodada(i)+'</h3>';
    r.forEach(m => {
      const lado = (id,sc,venc) => '<div class="bt'+(venc?' w':'')+'"><span class="g">'
        + (id ? esc(nomeDe(t,id)) : "—")+'</span><span>'+(sc==null?"":sc)+'</span></div>';
      const vA = m.done && m.a && m.b && m.ga > m.gb, vB = m.done && m.a && m.b && m.gb > m.ga;
      h += '<div class="bm">'+lado(m.a, m.ga, vA || (m.a && !m.b))+lado(m.b, m.gb, vB || (!m.a && m.b))+'</div>';
    });
    h += '</div>';
  });
  return h + '</div>';
}
function folhaHTML(t){
  const jogados = todosJogos(t).filter(j => j.done).length;
  let h = '<div class="pg">' + folhaCabecalho(t);
  if(t.modo === "mata"){
    h += '<h2>Chave</h2>' + folhaMataMata(t);
    if(jogados) h += '<h2>Classificação</h2>' + folhaClassificacao(t);
  } else {
    h += '<h2>Tabela de jogos</h2>' + folhaJogos(t);
    h += '<h2>Planilha por rodada · games ganhos</h2>' + folhaPlanilha(t);
    if(jogados) h += '<h2>Classificação · '+jogados+' de '+totalDeJogos(t)+' jogos</h2>' + folhaClassificacao(t);
    h += '<h2>Critérios de classificação e desempate</h2>' + folhaCriterios(t);
  }
  h += '<div class="frodape"><span>'+esc(textoRegraFim(t))
    +  ' Contagem 15/30/40 com ponto de ouro: no 40-40 o próximo ponto decide.</span>'
    +  '<span class="marca">Super N · jnsoftworks.com/supern</span></div>';
  return h + '</div>';
}
/* Ninguém quer súmula com letra de bula nem meia página em branco, então a
   folha é montada várias vezes — em algumas larguras e com a tabela de jogos
   em 1, 2 ou 3 colunas — e fica a combinação que permite a maior ampliação
   sem estourar a página nem cortar nome nenhum. Montar estreito e ampliar é
   o que deixa a letra crescer: a folha final tem sempre a largura do A4. */
const FOLHA_LARGS = [1000, 920, 850, 790, 733, 680, 620, 570, 520, 470, 430];
function folhaCortou(pg){
  const cels = pg.querySelectorAll(".fjogos .ea, .fjogos .eb, table.fpl td.nm, table.fcl td.nm, .fchave .g");
  for(let i=0;i<cels.length;i++) if(cels[i].scrollWidth > cels[i].clientWidth + 1) return true;
  return false;
}
function melhorFolha(pg){
  const jogos = pg.querySelector(".fjogos");
  const colunas = jogos ? [1,2,3] : [0];
  let melhor = null;
  colunas.forEach(c => {
    if(jogos) jogos.className = "fjogos c" + c;
    FOLHA_LARGS.forEach(L => {
      pg.style.width = L + "px";
      pg.style.setProperty("--fit", 1);
      if(folhaCortou(pg)) return;
      const fit = Math.min(FOLHA_L / L, FOLHA_UTIL / pg.scrollHeight);
      if(!melhor || fit > melhor.fit + 0.001) melhor = { larg:L, cols:c, fit:fit };
    });
  });
  if(!melhor){
    if(jogos) jogos.className = "fjogos c1";
    pg.style.width = FOLHA_L + "px";
    pg.style.setProperty("--fit", 1);
    melhor = { larg:FOLHA_L, cols:1, fit:Math.min(1, FOLHA_UTIL / pg.scrollHeight) };
  }
  if(jogos) jogos.className = "fjogos c" + melhor.cols;
  pg.style.width = melhor.larg + "px";
  pg.style.setProperty("--fit", melhor.fit);
  melhor.alto = pg.scrollHeight;
  return melhor;
}
/* --fit encolhe (ou amplia) para caber na página; --prev encolhe de novo,
   só na pré-visualização, para caber na tela do aparelho */
function ajustarFolha(){
  if(!folha.classList.contains("ver")) return;
  const pg = folha.querySelector(".pg"), wrap = folha.querySelector(".pgwrap"),
        papel = folha.querySelector(".papel");
  if(!pg) return;
  wrap.style.width = wrap.style.height = "auto";
  const m = melhorFolha(pg);
  const larg = Math.min(FOLHA_L, Math.ceil(m.larg * m.fit));
  const alto = Math.min(FOLHA_A, Math.ceil(m.alto * m.fit) + 4);
  wrap.style.width = larg + "px";
  wrap.style.height = alto + "px";
  const prev = Math.min(1, (folha.clientWidth - 24) / larg);
  wrap.style.setProperty("--prev", prev);
  papel.style.width = Math.round(larg * prev) + "px";
  papel.style.height = Math.round(alto * prev) + "px";
}
let tituloAntes = null;
function fecharFolha(){
  folha.classList.remove("ver");
  folha.innerHTML = "";

/* ---------------- ações ---------------- */
function ligarAcoes(){
  view.querySelectorAll("[data-acao]").forEach(b => b.addEventListener("click", ()=> acao(b.dataset.acao)));
  view.querySelectorAll("[data-abrir]").forEach(b => {
    const abrir = ()=>{ DB.ativo = b.dataset.abrir; DB.tab = "chave"; salvar(); render(); };
    b.addEventListener("click", abrir);
    b.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); abrir(); } });
  });
  view.querySelectorAll("[data-rodada]").forEach(b => b.addEventListener("click", ()=>{
    const t = ativo(); t.rodadaAtual = +b.dataset.rodada; salvar(); render();
  }));
  view.querySelectorAll("[data-vista]").forEach(b => b.addEventListener("click", ()=>{
    DB.vista = b.dataset.vista; salvar(); render();
  }));
  view.querySelectorAll("[data-vista-chave]").forEach(b => b.addEventListener("click", ()=>{
    DB.vistaChave = b.dataset.vistaChave; salvar(); render();
  }));
  view.querySelectorAll("[data-desdobra]").forEach(b => b.addEventListener("click", ()=>{
    DB.verCadeia = !DB.verCadeia; salvar();
    b.setAttribute("aria-expanded", DB.verCadeia ? "true" : "false");
    const alvo = view.querySelector("#cadeiaBox");
    if(alvo) alvo.classList.toggle("hide", !DB.verCadeia);
  }));
  view.querySelectorAll("[data-placar]").forEach(b => {
    const abrir = ()=> modalPlacar(b.dataset.placar);
    b.addEventListener("click", abrir);
    if(b.tagName !== "BUTTON") b.addEventListener("keydown", e => {
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); abrir(); }
    });
  });
  view.querySelectorAll("[data-live]").forEach(b => b.addEventListener("click", ()=> modalAoVivo(b.dataset.live)));
}
function acao(a){
  const t = ativo();
  if(a === "novo") return modalNovo();
  if(a === "rodada-ant"){ t.rodadaAtual = Math.max(1,(t.rodadaAtual||1)-1); salvar(); return render(); }
  if(a === "rodada-prox"){ t.rodadaAtual = Math.min(t.rodadas.length,(t.rodadaAtual||1)+1); salvar(); return render(); }
  if(a === "renomear") return modalTexto({
    titulo:"Renomear torneio", valor:t.nome, dica:"Nome do torneio",
    aoConfirmar: v => { t.nome = v; salvar(); render(); toast("Torneio renomeado"); }
  });
  if(a === "sortear"){
    const sortear = () => { gerarChave(t); t.rodadaAtual = 1; salvar(); render(); toast("Chave sorteada de novo"); };
    if(!todosJogos(t).some(j=>j.done)) return sortear();
    return modalConfirma({
      titulo:"Sortear de novo?", perigo:true, ok:"Sortear e apagar",
      texto:"Já existem placares lançados. Um novo sorteio refaz a chave e apaga todos os resultados.",
      aoConfirmar: sortear
    });
  }
  if(a === "excluir") return modalConfirma({
    titulo:"Excluir torneio", perigo:true, ok:"Excluir",
    texto:'"'+t.nome+'" e todos os resultados serão apagados. Não dá para desfazer.',
    aoConfirmar: ()=>{
      DB.torneios = DB.torneios.filter(x => x.id !== t.id);
      DB.ativo = null; DB.tab = "torneios"; salvar(); render(); toast("Torneio excluído");
    }
  });
  if(a === "participantes") return modalParticipantes();
  if(a === "desempate") return modalDesempate();
  if(a === "instalar") return modalInstalar();
  if(a === "dados"){ DB.viuDados = true; salvar(); return modalDados(); }
  if(a === "sobre") return modalSobre();
  if(a === "editar-regras") return modalRegras();
  if(a === "reset-regras"){ t.regras = null; salvar(); render(); toast("Regulamento padrão restaurado"); return; }
  if(a === "compartilhar") return compartilhar();
  if(a === "pdf") return abrirFolha();
  if(a === "exportar"){
    copiar(JSON.stringify(DB.torneios));
    return;
  }
  if(a === "importar") return modalTexto({
    titulo:"Importar torneios", linhas:true, ok:"Importar",
    texto:"Cole aqui os dados que você copiou em Exportar, deste ou de outro aparelho.",
    dica:'[{"id":"...","nome":"..."}]',
    aoConfirmar: txt => {
      try{
        const arr = JSON.parse(txt);
        if(!Array.isArray(arr)) throw 0;
        const ids = {}; DB.torneios.forEach(x => { ids[x.id] = true; });
        let novos = 0, ruins = 0;
        arr.forEach(x => {
          const ok = sanearTorneio(x);
          if(!ok){ ruins++; return; }
          if(ids[ok.id]) return;
          DB.torneios.push(ok); ids[ok.id] = true; novos++;
        });
        salvar(); render();
        toast(novos ? (novos === 1 ? "1 torneio importado" : novos + " torneios importados")
                    : ruins ? "Esses dados não são de um torneio" : "Nenhum torneio novo");
      }catch(e){ toast("Não consegui ler esses dados"); }
    }
  });
}
function copiar(txt){
  const ok = ()=> toast("Copiado!");
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, ()=>copiaVelha(txt,ok));
  else copiaVelha(txt, ok);
}
function copiaVelha(txt, ok){
  const ta = document.createElement("textarea");
  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); ok(); }catch(e){ toast("Copie manualmente"); }
  document.body.removeChild(ta);
}
function compartilhar(){
  const t = ativo(), cls = calcularClassificacao(t);
  let txt = "🏐 "+t.nome+" — "+MODOS[t.modo].nome+"\n\n";
  cls.forEach(L => { txt += (L.pos===1?"🥇":L.pos===2?"🥈":L.pos===3?"🥉":L.pos+"º")+" "+L.nome+" — "+fmtPts(L.PTS)+" pts ("+L.V+"V/"+L.D+"D, saldo "+(L.SG>0?"+":"")+L.SG+")\n"; });
  txt += "\nGerado no app Super N Beach Tennis";
  if(navigator.share) navigator.share({ title:t.nome, text:txt }).catch(()=>copiar(txt));
  else copiar(txt);
}

function modalNovo(){
  const box = abrirModal(
    '<h2>Novo torneio</h2><p class="small muted" style="margin-bottom:14px">Escolha o formato e o app monta a chave.</p>'

    +   Object.keys(MODOS).map((k,i)=>'<button class="pill'+(i===0?' on':'')+'" data-modo="'+k+'">'+MODOS[k].nome+'</button>').join("")
    + '</div><p class="small muted" id="nvModoDesc" style="margin-top:6px">'+MODOS.rodizio.desc+'</p></label>'
    + '<label class="fld"><span id="nvQtdLabel">Quantos atletas</span>'
    +   '<div class="row"><button class="btn sm" id="nvMenos">−</button>'
    +   '<input type="number" id="nvQtd" min="4" max="16" value="8" class="tnum center" style="font-weight:800;font-size:19px">'
    +   '<button class="btn sm" id="nvMais">+</button></div>'
    +   '<p class="small muted" style="margin-top:6px">de 4 a 16</p></label>'
    + '<div class="sec"><h2 id="nvNomesTit">Atletas</h2><div class="lista" id="nvNomes"></div></div>'
    + '<div id="nvAvancado"></div>'
    + '<div class="row" style="margin-top:16px"><button class="btn grow" id="nvCancelar">Cancelar</button>'
    + '<button class="btn pri grow" id="nvCriar">Gerar chave</button></div>'
  );
  let modo = "rodizio", criterio = "games", games = 5, meio = CRITERIOS.games.desempate.slice();
  const inQtd = box.querySelector("#nvQtd");
  const nomes = [];
  function sincronizaNomes(){
    const q = Math.max(4, Math.min(16, +inQtd.value || 8));
    while(nomes.length < q) nomes.push("");
    nomes.length = q;
    box.querySelector("#nvNomes").innerHTML = nomes.map((v,i) =>
      '<div class="item"><div class="num">'+(i+1)+'</div><input type="text" data-i="'+i+'" value="'+esc(v)+'" placeholder="'+(modo==="rodizio"?"Atleta "+(i+1):"Dupla "+(i+1))+'"></div>').join("");
    box.querySelectorAll("#nvNomes input").forEach(inp => inp.addEventListener("input", e => { nomes[+e.target.dataset.i] = e.target.value; }));
    avancado(q);
  }
  function avancado(q){
    const maxQuadras = Math.max(1, Math.floor(q/ (modo==="rodizio" ? 4 : 2)));
    const maxRod = (q%2===0 ? q : q+1) - 1;
    box.querySelector("#nvAvancado").innerHTML = (modo!=="mata"
      ? '<label class="fld"><span>Quadras simultâneas</span><select id="nvQuadras">'
        + Array.from({length:maxQuadras},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===maxQuadras?' selected':'')+'>'+(i+1)+'</option>').join("")
        + '</select></label>'
        + (modo==="rodizio"
          ? '<label class="fld"><span>Rodadas</span><select id="nvRodadas">'
            + Array.from({length:maxRod},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===maxRod?' selected':'')+'>'+(i+1)+(i+1===maxRod?' (rodízio completo)':'')+'</option>').join("")
            + '</select></label>' : "")
        + '<label class="fld"><span>Classificação por</span><div class="pillrow" id="nvCriterio">'
        + Object.keys(CRITERIOS).map(k => '<button class="pill'+(k===criterio?' on':'')+'" data-crit="'+k+'">'+CRITERIOS[k].nome+'</button>').join("")
        + '</div><div class="dica" id="nvCritDica"></div></label>'
        + '<div class="sec"><h2>Ordem de desempate</h2><div class="card" id="nvCadeia"></div></div>'
      : "")
      + '<label class="fld"><span>Games por jogo</span>'
      + '<div class="games-sel"><button class="btn sm" id="nvGMenos" aria-label="Menos um game">−</button>'
      +   '<div class="games-num grow" id="nvGNum" aria-live="polite"></div>'
      +   '<button class="btn sm" id="nvGMais" aria-label="Mais um game">+</button></div>'
      + '<input type="range" min="1" max="11" step="1" id="nvGRange" value="'+games+'" aria-label="Games por jogo">'
      + '<div class="escala"><span>1</span><span>11</span></div>'

    box.querySelector("#nvGMenos").addEventListener("click", ()=>{ games = Math.max(1, games-1); range.value = games; atualiza(); });
    box.querySelector("#nvGMais").addEventListener("click", ()=>{ games = Math.min(11, games+1); range.value = games; atualiza(); });

  }
  function atualiza(){
    const fake = { modo:modo, parts:[], rodadas:[], cfg:{ criterio:criterio, games:games,
      regraFim: modo==="mata" ? "corrida" : CRITERIOS[criterio].regraFim } };

    if(cd) cd.textContent = CRITERIOS[criterio].resumo;
    const cad = box.querySelector("#nvCadeia");

    box.querySelector("#nvModo").querySelectorAll(".pill").forEach(x=>x.classList.remove("on"));

    box.querySelector("#nvModoDesc").textContent = MODOS[modo].desc;
    box.querySelector("#nvQtdLabel").textContent = modo==="rodizio" ? "Quantos atletas" : "Quantas duplas";
    box.querySelector("#nvNomesTit").textContent = modo==="rodizio" ? "Atletas" : "Duplas";
    sincronizaNomes();
  }));
  box.querySelector("#nvMenos").addEventListener("click", ()=>{ inQtd.value = Math.max(4, (+inQtd.value||8)-1); sincronizaNomes(); });
  box.querySelector("#nvMais").addEventListener("click", ()=>{ inQtd.value = Math.min(16, (+inQtd.value||8)+1); sincronizaNomes(); });
  inQtd.addEventListener("change", sincronizaNomes);
  box.querySelector("#nvCancelar").addEventListener("click", fecharModal);
  box.querySelector("#nvCriar").addEventListener("click", ()=>{
    const q = Math.max(4, Math.min(16, +inQtd.value || 8));

    const dados = {
      nome: (box.querySelector("#nvNome").value||"").trim() || (modo==="rodizio" ? "Super "+q : MODOS[modo].nome),
      modo: modo, nomes: finais,

      rodadas: box.querySelector("#nvRodadas") ? +box.querySelector("#nvRodadas").value : null,

    };

    DB.torneios.push(t); DB.ativo = t.id; DB.tab = "chave"; salvar(); fecharModal(); render();
    toast("Chave gerada!");
  });
