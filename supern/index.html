}

function acharJogo(t, id){
  if(t.modo === "mata"){
    let achado = null;
    t.chave.rodadas.forEach(r => r.forEach(m => { if(m.id === id) achado = m; }));
    return achado;
  }
  let achado = null;
  t.rodadas.forEach(r => r.jogos.forEach(j => { if(j.id === id) achado = j; }));
  return achado;
}
function ladosDoJogo(t, j){
  return t.modo === "mata"
    ? { A: j.a ? nomeDe(t,j.a) : "a definir", B: j.b ? nomeDe(t,j.b) : "a definir" }
    : { A: nomesLado(t,j.a), B: nomesLado(t,j.b) };
}
function gravarPlacar(t, j, ga, gb, manterLive){
  j.ga = ga; j.gb = gb; j.done = true;
  if(!manterLive) j.live = null;
  if(t.modo === "mata") recalcularChave(t.chave);
  salvar();
}
function apagarPlacar(t, j){
  j.ga = null; j.gb = null; j.done = false; j.live = null;
  if(t.modo === "mata") recalcularChave(t.chave);
  salvar();
}
/* reabre o jogo mantendo os games já disputados no placar ao vivo */
function apagarPlacarMantendoLive(t, j){
  j.ga = null; j.gb = null; j.done = false;
  if(t.modo === "mata") recalcularChave(t.chave);
  salvar();
}
function modalPlacar(id){
  const t = ativo(), j = acharJogo(t,id);
  if(!j || (t.modo==="mata" && (!j.a || !j.b))) return;
  const L = ladosDoJogo(t,j);
  const N = t.cfg.games, regra = regraFim(t), maioria = maioriaGames(t);
  const exato = regra === "exato", tetoTotal = regra !== "corrida";   // teto de N games no jogo inteiro
  const hist = [];
  let ga, gb;
  if(j.ga != null){ ga = Math.max(0, j.ga); gb = Math.max(0, j.gb); }
  else if(exato){ ga = Math.floor(N/2); gb = N - ga; }
  else { ga = 0; gb = 0; }
  const box = abrirModal('<h2>Lançar placar</h2><div id="pl"></div>', true);
  /* Mexer num lado só mexe no outro quando o total passaria do número de games do jogo. */
  function proximo(k, d){
    let na = k === "a" ? ga + d : ga;
    let nb = k === "b" ? gb + d : gb;
    if(na < 0 || nb < 0) return null;
    if(tetoTotal){
      if(na + nb > N){                       // estourou: o outro lado cede um game
        if(k === "a") nb = N - na; else na = N - nb;
        if(na < 0 || nb < 0) return null;
      }
    } else if(na > N || nb > N || (na === N && nb === N)) return null;  // corrida: só um lado chega ao alvo
    return [na, nb];
  }
  function ajusta(k, d){
    const p = proximo(k, d);
    if(!p) return;
    hist.push([ga, gb]);
    ga = p[0]; gb = p[1]; desenha();
  }
  function desfazer(){
    const u = hist.pop(); if(!u) return;
    ga = u[0]; gb = u[1]; desenha();
  }
  function aviso(){
    if(exato) return ga + gb === N ? ""
      : "Placar parcial: " + (ga+gb) + " de " + N + " games. Como a classificação é por games ganhos, salve assim só em caso de W.O. ou interrupção.";
    if(regra === "maioria"){
      if(ga >= maioria || gb >= maioria || ga + gb === N) return "";
      return "Ninguém chegou a " + maioria + " games nem completou os " + N + " — salve assim só se foi W.O. ou interrupção.";
    }
    if(ga === gb) return "Jogo eliminatório não pode terminar empatado — ninguém avançaria.";
    if(ga < N && gb < N) return "Numa corrida até " + N + " games, um dos lados precisa chegar a " + N + ".";
    return "";
  }
  function desenha(){
    const av = aviso();
    box.querySelector("#pl").innerHTML =
      '<div class="dica" style="margin-bottom:2px">' + textoRegraFimHTML(t)
      + (tetoTotal ? " Subir um lado no total cheio tira um game do outro." : "") + '</div>'
      + '<div class="live">' + lado("a", L.A, ga) + lado("b", L.B, gb) + '</div>'
      + '<div class="row" style="margin-top:10px">'
      +   '<button class="btn sm blk" id="plUndo"'+(hist.length?'':' disabled')+'>↶ Desfazer</button>'
      + '</div>'
      + '<div class="slot">' + (av ? '<div class="aviso">' + esc(av) + '</div>' : '') + '</div>'
      + '<div class="row"><button class="btn grow" id="plCancel">Cancelar</button>'
      + '<button class="btn pri grow" id="plOk">Salvar placar</button></div>'
      + (j.done ? '<button class="btn sm blk danger" id="plLimpar" style="margin-top:10px">Limpar resultado</button>' : '');
    box.querySelectorAll("[data-mais]").forEach(b => b.addEventListener("click", ()=> ajusta(b.dataset.mais, 1)));
    box.querySelectorAll("[data-menos]").forEach(b => b.addEventListener("click", ()=> ajusta(b.dataset.menos, -1)));
    box.querySelector("#plUndo").addEventListener("click", desfazer);
    box.querySelector("#plCancel").addEventListener("click", fecharModal);
    box.querySelector("#plOk").addEventListener("click", ()=>{
      gravarPlacar(t,j,ga,gb); fecharModal(); render(); toast("Placar salvo");
    });
    const lim = box.querySelector("#plLimpar");
    if(lim) lim.addEventListener("click", ()=>{ apagarPlacar(t,j); fecharModal(); render(); toast("Resultado apagado"); });
  }
  function lado(k, nome, v){
    const venceu = regra === "maioria" ? v >= maioria : (regra === "corrida" && v >= N);
    const pode = d => !!proximo(k, d);
    return '<div class="livecard'+(venceu?' saque':'')+'"><div class="who">'+esc(nome)+'</div>'
      + '<div class="pt">'+v+'</div>'
      + '<div class="row"><button class="btn grow" data-menos="'+k+'"'+(pode(-1)?'':' disabled')+'>−</button>'
      +   '<button class="btn grow" data-mais="'+k+'"'+(pode(1)?'':' disabled')+'>+</button></div>'
      + '<div class="gmlive" style="margin-top:6px">'+(venceu ? "venceu" : (tetoTotal ? "de " : "até ")+N+" games")+'</div></div>';
  }
  desenha();
}

/* ---------------- placar ao vivo ---------------- */
const PONTOS = ["0","15","30","40"];
function modalAoVivo(id){
  const t = ativo(), j = acharJogo(t,id);
  if(!j) return;
  const L = ladosDoJogo(t,j);
  if(!j.live) j.live = { pa:0, pb:0, ga:j.ga||0, gb:j.gb||0, saque:0, hist:[] };
  const S = j.live;
  let encerrado = !!j.done;          // jogo já fechado: mostra o resumo, com desfazer disponível
  const box = abrirModal('<h2>Placar ao vivo</h2><div id="lv"></div>');
  function rotulo(p, o){
    return PONTOS[Math.min(p,3)];
  }
  function ponto(lado){
    S.hist.push({ pa:S.pa, pb:S.pb, ga:S.ga, gb:S.gb, saque:S.saque });
    if(lado==="a") S.pa++; else S.pb++;
    const p = lado==="a"?S.pa:S.pb, o = lado==="a"?S.pb:S.pa;
    const ganhou = p >= 4;             // ponto de ouro: quem chega a 4 pontos leva o game
    if(ganhou){
      if(lado==="a") S.ga++; else S.gb++;
      S.pa = 0; S.pb = 0; S.saque = 1 - S.saque;
    }
    salvar();
    const N = t.cfg.games, regra = regraFim(t);
    const acabou = regra === "corrida" ? (S.ga >= N || S.gb >= N) : (S.ga + S.gb >= N);
    if(acabou) fim(); else desenha();
  }
  /* encerra sem fechar o modal: dá para desfazer o último ponto se foi toque errado */
  function fim(){
    gravarPlacar(t, j, S.ga, S.gb, true);
    encerrado = true; desenha();
  }
  function desfazer(){
    const u = S.hist.pop(); if(!u) return;
    S.pa = u.pa; S.pb = u.pb; S.ga = u.ga; S.gb = u.gb; S.saque = u.saque;
    if(encerrado){ encerrado = false; j.done = false; j.ga = null; j.gb = null;
      if(t.modo === "mata") recalcularChave(t.chave); }
    salvar(); desenha();
  }
  function desenha(){
    const N = t.cfg.games, regra = regraFim(t), maioria = maioriaGames(t);
    const feitos = S.ga + S.gb;
    const garantiu = regra === "maioria" && (S.ga >= maioria || S.gb >= maioria);
    const quemGarantiu = S.ga >= maioria ? L.A : L.B;
    box.querySelector("#lv").innerHTML =
      '<p class="small muted center" style="margin-bottom:2px">'
      + (regra === "corrida" ? "Corrida até "+N+" games" : "Game "+Math.min(feitos+1,N)+" de "+N)
      + ' · ponto de ouro</p>'
      + '<div class="live">'
      + '<div class="livecard'+(S.saque===0?' saque':'')+'"><div class="who">'+esc(L.A)+'</div>'
      +   '<div class="pt">'+rotulo(S.pa,S.pb)+'</div><div class="gmlive">'+S.ga+' games</div>'
      +   '<button class="addpt" data-p="a"'+(encerrado?" disabled":"")+'>+ PONTO</button></div>'
      + '<div class="livecard'+(S.saque===1?' saque':'')+'"><div class="who">'+esc(L.B)+'</div>'
      +   '<div class="pt">'+rotulo(S.pb,S.pa)+'</div><div class="gmlive">'+S.gb+' games</div>'
      +   '<button class="addpt" data-p="b"'+(encerrado?" disabled":"")+'>+ PONTO</button></div></div>'
      + '<p class="small center muted" style="margin:2px 0 0">🎾 saque: <b>'+esc(S.saque===0?L.A:L.B)+'</b></p>'
      + '<div class="slot">'
      +   (encerrado
            ? '<div class="venceu" style="width:100%">Jogo encerrado — '+S.ga+' × '+S.gb+'</div>'
            : garantiu ? '<div class="venceu" style="width:100%">'+esc(quemGarantiu)+' já garantiu a vitória. Dá para encerrar agora ou seguir até '+N+' games.</div>' : '')
      + '</div>'
      + '<button class="btn blk" id="lvUndo"'+(S.hist.length?'':' disabled')+'>↶ Desfazer último ponto</button>'
      + '<div class="row" style="margin-top:8px">'
      +   (encerrado
            ? '<button class="btn grow" id="lvSair">Fechar</button>'
              + '<button class="btn azul grow" id="lvReabrir">Reabrir jogo</button>'
            : '<button class="btn grow" id="lvSair">Pausar</button>'
              + '<button class="btn pri grow" id="lvFim">Encerrar jogo</button>')
      + '</div>';
    box.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", ()=> ponto(b.dataset.p)));
    box.querySelector("#lvUndo").addEventListener("click", desfazer);
    box.querySelector("#lvSair").addEventListener("click", ()=>{ salvar(); fecharModal(); render(); });
    const bf = box.querySelector("#lvFim");
    if(bf) bf.addEventListener("click", fim);
    const br = box.querySelector("#lvReabrir");
    if(br) br.addEventListener("click", ()=>{
      encerrado = false; apagarPlacarMantendoLive(t, j); desenha();
      toast("Jogo reaberto em " + S.ga + " × " + S.gb);
    });
  }
  desenha();
}

<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    var aceitou = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(aceitou){ aceitou = false; location.reload(); }
    });
    navigator.serviceWorker.register("sw.js").then(function(reg){
      var oferecer = function(sw){
        if(!sw || !navigator.serviceWorker.controller) return;   // 1a instalacao: nada a avisar
        if(window.avisarAtualizacao) window.avisarAtualizacao(function(){
          aceitou = true; sw.postMessage("aplicar");
        });
      };
      if(reg.waiting) oferecer(reg.waiting);
      reg.addEventListener("updatefound", function(){
        var novo = reg.installing;
        if(!novo) return;
        novo.addEventListener("statechange", function(){
          if(novo.state === "installed") oferecer(novo);
        });
      });
      var checar = function(){ if(!document.hidden){ try{ reg.update(); }catch(e){} } };
      document.addEventListener("visibilitychange", checar);
      setTimeout(checar, 3000);
    }).catch(function(){});
  });
}
</script>
